# ------------------------------------------------------------
# Site
# ------------------------------------------------------------
title:                   "ChrisRanAn — Notes"
subtitle:                "Personal blogs & study notes"
name:                    "ChrisRanAn"
description:             >-
  Personal blog and study notes.
url:                     "https://chrisranan1.github.io"
baseurl:                 "/blog"
repository:              "ChrisRanAn1/blog"
locale:                  "en-US"
timezone:                Asia/Shanghai
words_per_minute:        200

# ------------------------------------------------------------
# Theme (remote — GitHub Pages compatible)
# ------------------------------------------------------------
remote_theme:            "mmistakes/minimal-mistakes"
minimal_mistakes_skin:   "contrast"   # default, air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise
search:                  true
search_full_content:     true

# ------------------------------------------------------------
# Author sidebar
# ------------------------------------------------------------
author:
  name:                  "ChrisRanAn"
  avatar:                "https://github.com/ChrisRanAn1.png"
  bio:                   "security is from the depth of understanding"
  location:              "New York"
  links:
    - label:             "GitHub"
      icon:              "fab fa-fw fa-github"
      url:               "https://github.com/ChrisRanAn1"

footer:
  links:
    - label:             "GitHub"
      icon:              "fab fa-fw fa-github"
      url:               "https://github.com/ChrisRanAn1"

# ------------------------------------------------------------
# Reading / build
# ------------------------------------------------------------
markdown:                kramdown
highlighter:             rouge
permalink:               /:categories/:title/
paginate:                10
paginate_path:           /page:num/

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - node_modules

# ------------------------------------------------------------
# Plugins (all allow-listed by GitHub Pages)
# ------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-remote-theme
  - jemoji

# ------------------------------------------------------------
# Defaults — enable sidebar, TOC, and read-time for every post
# ------------------------------------------------------------
defaults:
  - scope:
      path:              ""
      type:              posts
    values:
      layout:            single
      author_profile:    true
      read_time:         true
      comments:          false
      share:             true
      related:           true
      show_date:         true
      toc:               true
      toc_sticky:        true

  - scope:
      path:              "_pages"
      type:              pages
    values:
      layout:            single
      author_profile:    true

# ------------------------------------------------------------
# Categories / tags — manual archives (GitHub Pages safe)
# ------------------------------------------------------------
category_archive:
  type:                  liquid
  path:                  /categories/
tag_archive:
  type:                  liquid
  path:                  /tags/
