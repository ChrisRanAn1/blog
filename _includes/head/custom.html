<!-- Mermaid diagram support: transforms <pre><code class="language-mermaid"> blocks into rendered diagrams -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var blocks = document.querySelectorAll('pre > code.language-mermaid');
    blocks.forEach(function (code) {
      var oldPre = code.parentElement;
      var newPre = document.createElement('pre');
      newPre.className = 'mermaid';
      newPre.textContent = code.textContent;
      oldPre.parentElement.replaceChild(newPre, oldPre);
    });
    if (window.mermaid) {
      var isDark = document.documentElement.classList.contains('dark') ||
                   window.matchMedia('(prefers-color-scheme: dark)').matches;
      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? 'dark' : 'default',
        securityLevel: 'loose'
      });
      mermaid.run({ querySelector: 'pre.mermaid' });
    }
  });
</script>
